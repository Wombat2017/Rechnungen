 <div class="card"><b>Positionen</b>${(i.items||[]).map((x,k)=>{const ro=String(x.ep||'').trim()!=='';return `<div class="itm"><div class="ih"><b>Pos. ${k+1}</b><span><label class="ck" style="display:inline-flex;margin:0 6px 0 0;font-size:13px"><input type="checkbox" data-b="items.${k}.h" ${x.h?'checked':''}> Überschrift</label><button class="x" data-a="up" data-i="${k}">↑</button> <button class="x" data-a="dn" data-i="${k}">↓</button> <button class="x" data-a="delItem" data-i="${k}">✕</button></span></div><label>Leistung (Zeilenumbruch mit Enter)</label><textarea class="au" rows="2" data-b="items.${k}.t" placeholder="Leistungsbeschreibung">${e(x.t)}</textarea><div class="g4"><div><label>Menge</label><input ${D} data-b="items.${k}.q" value="${e(x.q)}"></div><div><label>Einheit</label><select data-b="items.${k}.u">${UN(x.u)}</select></div><div><label>Einzelpreis</label><input ${D} data-b="items.${k}.ep" value="${e(x.ep)}" placeholder="optional"></div><div><label>Betrag</label><input ${D} data-b="items.${k}.a" value="${e(x.a)}" ${ro?'readonly':''}></div></div></div>`}).join('')}<button data-a="addItem">+ Position</button>
 ${isAZ(i)?`<hr><b>Bisherige Abschlagsrechnungen</b> <button data-a="hist">Aus Historie laden</button><div style="margin-top:8px">${(i.prev||[]).map((v,k)=>`<div class="row"><span class="s">${k+1}. AZ</span><input ${D} data-b="prev.${k}" value="${e(v)}"><button class="x" data-a="delPrev" data-i="${k}">✕</button></div>`).join('')}</div><button data-a="addPrev">+ AZ</button><label>Liefer-/Leistungsstand (leer = automatisch)</label><input ${D} data-b="stand" value="${e(i.stand)}">${(()=>{const p=S.pro.find(x=>x.id===i.pid);if(!p)return'';const t=pst(p,i.id);return `<small style="display:block;margin-top:6px;color:var(--mu)">Auftragssumme netto ${eur(t.lv)} · bisher abgerechnet ${eur(t.net)} · Rest ${eur(t.rest)}</small><button style="margin-top:6px" data-a="stLV">Leistungsstand = Auftragssumme</button>`})()}`:''}
 <div class="g">${B('vat','USt %',i.vat??S.set.vat,'text',D)}<div><label>Status</label><select data-b="status">${['Entwurf','Versendet','Bezahlt'].map(s=>`<option ${i.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>${CB(i,'rc','§ 13b UStG: Steuerschuldnerschaft des Leistungsempfängers (USt 0 %, Hinweistext)',false)}</div><div class="card"><b>Konditionen</b><div class="g">${B('rab','Rabatt %',i.rab,'text',D)}${B('sib','Sicherheitseinbehalt %',i.sib,'text',D)}${B('sk','Skonto %',i.sk,'text',D)}${B('skd','Skonto-Tage',i.skd,'text',D)}${B('paid','Bezahlt am',i.paid,'date')}</div>${CB(i,'priv','Hinweis Aufbewahrungspflicht (Rechnung an Privatperson, § 14b UStG)',false)}</div><div class="card"><b>Anzeige auf der Rechnung</b>${isAZ(i)?CB(i,'showStand','Liefer-/Leistungsstand und Abzug früherer AZ'):''}${i.type!=='AN'?CB(i,'showPay','Zahlungshinweis mit Bankdaten'):''}${CB(i,'showDue',i.type==='AN'?'Gültig bis':'Zahlbar bis')}${CB(i,'showCno','Kundennummer')}${CB(i,'showFoot','Fußzeile')}<small style="color:var(--mu)">Leere Felder werden auf der Rechnung automatisch ausgeblendet.</small></div>`;autosize()}
function newInv(base={}){const s=S.set;S.cur={type:'AZ',no:s.prefix+s.next,date:today(),cid:'',bv:'',intro:'vielen Dank für Ihren Auftrag und das damit verbundene Vertrauen. Wir stellen Ihnen folgende Positionen in Rechnung:',items:[{q:'1',u:'psch.',t:'',a:''}],prev:[],stand:'',period:'',due:addDays(today(),+s.days||14),status:'Entwurf',...base};S.cur.title=autoTitle();S.cur.fresh=true;S.view='edit';render()}
async function saveInv(){const i={...S.cur},t=calc(i);i.net=t.net;i.gross=t.gross;if(i.paid)i.status='Bezahlt';const fresh=i.fresh;delete i.fresh;const id=i.id||('i'+Date.now());delete i.id;await db.collection('invoices').doc(id).set(i);S.cur.id=id;if($('acts'))$('acts').innerHTML=acts();
 if(fresh&&i.no===S.set.prefix+S.set.next){S.set.next=(+S.set.next||0)+1;await saveSet()}S.cur.fresh=false;toast('Gespeichert')}
function chk(i){const s=S.set,c=cusOf(i.cid),m=[];if(i.type==='AN')return m;if(!s.name)m.push('Name des Leistenden');if(!s.addr)m.push('Anschrift des Leistenden');if(!s.stnr&&!s.ustid)m.push('Steuernummer oder USt-ID');if(!c.name||!c.addr)m.push('Empfänger mit Anschrift');if(!i.period)m.push('Leistungszeitraum');if(!(i.items||[]).some(x=>x.t&&x.a))m.push('Position mit Betrag');if(!i.rc&&!num(i.vat??s.vat))m.push('USt-Hinweis (0 %: z. B. § 19 UStG im Schlusstext)');return m}
function openPreview(){const el=$('pvs');el.style.zoom=1;el.innerHTML=sheet(S.cur);const pg=el.querySelectorAll('.pg').length,m=chk(S.cur);
 $('pvi').innerHTML=`Seiten: ${pg}${pg>1?' (automatischer Umbruch)':''}<br>`+(m.length?`<span style="color:#b45309">Bitte prüfen (Pflichtangaben): ${m.join(', ')}</span>`:'Pflichtangaben vollständig');$('pv').style.display='block';fitPv()}
function fitPv(){if($('pv').style.display==='block')$('pvs').style.zoom=Math.min(1,(innerWidth-16)/794)}
async function pdf(){const fn=(S.cur.no+'_'+(cusOf(S.cur.cid).name||'')).replace(/[^\w\-äöüÄÖÜß]+/g,'_')+'.pdf',cl=$('pvs').cloneNode(true);cl.id='';cl.style.zoom='1';cl.className+=' nogap';toast('PDF wird erstellt…');
 try{const blob=await html2pdf().set({margin:0,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,windowWidth:794,width:794,x:0,y:0,scrollX:0,scrollY:0,backgroundColor:'#fff'},jsPDF:{unit:'mm',format:'a4'},pagebreak:{mode:['css']}}).from(cl).outputPdf('blob');
  dl(fn,blob)}catch(x){toast('PDF-Fehler: '+(x&&x.message||x))}}
const saveSet=()=>db.collection('cfg').doc('main').set(S.set);
async function backup(){const data=JSON.stringify({v:1,set:S.set,cus:S.cus,pro:S.pro,inv:S.inv},null,1);try{dl('rechnungstool-backup-'+today()+'.json',new Blob([data],{type:'application/json'}))}catch(x){$('bk').value=data;toast('Download nicht möglich – Text unten kopieren')}}
async function restore(txt){try{const j=JSON.parse(txt);if(j.set){S.set={...S.set,...j.set};await saveSet()}for(const c of j.cus||[]){const{id,...r}=c;await db.collection('customers').doc(id).set(r)}for(const c of j.pro||[]){const{id,...r}=c;await db.collection('projects').doc(id).set(r)}for(const x of j.inv||[]){const{id,...r}=x;await db.collection('invoices').doc(id).set(r)}toast('Import fertig')}catch(x){toast('Import fehlgeschlagen')}}
const acts=()=>`<button class="p" data-a="save">Speichern</button>${S.cur.id?'<button data-a="dup">Duplizieren</button>':''}<button data-a="preview">Vorschau &amp; PDF</button><button data-a="list">Zurück</button>${S.cur.id?'<button data-a="delInv">Löschen</button>':''}`;
function render(){const v=S.view;['list','pro','cus','set'].forEach(k=>$('n-'+k).className=v===k?'on':'');const a=$('app');
 if(v==='list'){const q=S.q.toLowerCase(),L=S.inv.filter(i=>(i.no+i.bv+cusOf(i.cid).name+i.title).toLowerCase().includes(q)).sort((x,y)=>(y.date+y.no).localeCompare(x.date+x.no));
  const open=S.inv.filter(i=>i.status==='Versendet'&&i.type!=='AN').reduce((s,i)=>s+(i.gross||0),0);
  a.innerHTML=`<h2>Rechnungen</h2><div class="row" style="margin-bottom:8px"><button data-a="csv">CSV für Buchhaltung</button></div><div class="card">Offen (versendet): <b>${eur(open)}</b></div><input data-q="1" placeholder="Suchen…" value="${e(S.q)}"><div class="card" style="margin-top:12px">${L.map(i=>`<div class="li"><div data-a="editInv" data-id="${i.id}" style="cursor:pointer;flex:1"><b>${e(i.no)}</b> · ${e(i.title)}<small>${e(cusOf(i.cid).name)} · ${e(i.bv)} · ${dd(i.date)}</small></div><div style="text-align:right"><b>${eur(i.gross)}</b><br><span class="b">${e(i.status)}</span>${i.status==='Versendet'&&i.due&&i.due<today()?' <span class="b" style="border-color:#b45309;color:#b45309">Überfällig</span>':''}${i.type==='AZ'?`<br><button style="margin-top:4px;padding:3px 8px;font-size:12px" data-a="folge" data-id="${i.id}">Folge-AZ</button>`:''}</div></div>`).join('')||'<small>Noch keine Rechnungen.</small>'}</div>`}
 else if(v==='edit'){a.innerHTML=`<div id="form"></div><div class="row noprint" id="acts">${acts()}</div><div id="wrap"><div id="sheet" class="sheet"></div></div>`;renderForm();drawSheet()}
 else if(v==='pro'){const c=S.pe||{};a.innerHTML=`<h2>Projekte (Bauvorhaben)</h2><div class="card"><div class="g"><div><label>Bauvorhaben</label><input id="pn" value="${e(c.name)}"></div><div><label>Kunde</label><select id="pc"><option value="">– wählen –</option>${S.cus.map(k=>`<option value="${k.id}" ${c.cid===k.id?'selected':''}>${e(k.name)}</option>`).join('')}</select></div><div><label>Auftragssumme netto (LV)</label><input id="pl" inputmode="decimal" value="${e(c.lv)}"></div></div><div class="row" style="margin-top:8px"><button class="p" data-a="savePro">${c.id?'Aktualisieren':'Projekt anlegen'}</button></div></div>${S.pro.map(p=>{const t=pst(p);return `<div class="card"><div class="li" style="border:0;padding:0"><div data-a="editPro" data-id="${p.id}" style="cursor:pointer;flex:1"><b>${e(p.name)}</b><small>${e(cusOf(p.cid).name)}</small></div><button data-a="delPro" data-id="${p.id}">✕</button></div><div style="height:6px;background:var(--bd);border-radius:9px;margin:10px 0"><div style="height:6px;width:${t.pct}%;background:var(--tx);border-radius:9px"></div></div><small style="color:var(--mu)">Auftrag netto ${eur(t.lv)} · abgerechnet ${eur(t.net)} (${t.pct.toFixed(0)} %) · Rest ${eur(t.rest)}<br>Bezahlt ${eur(t.paid)} · offen ${eur(t.open)} (brutto)</small></div>`}).join('')||'<small>Noch keine Projekte.</small>'}`}
 else if(v==='cus'){const c=S.ce||{};a.innerHTML=`<h2>Kunden</h2><div class="card"><div class="g"><div><label>Name</label><input id="cn" value="${e(c.name)}"></div><div><label>Kundennummer (optional)</label><input id="cr" value="${e(c.no)}"></div></div><label>Adresse (mehrzeilig)</label><textarea id="ca" rows="3">${e(c.addr)}</textarea><div class="row" style="margin-top:8px"><button class="p" data-a="saveCus">${c.id?'Aktualisieren':'Kunde anlegen'}</button></div></div><div class="card">${S.cus.map(c=>`<div class="li"><div data-a="editCus" data-id="${c.id}" style="cursor:pointer;flex:1">${e(c.name)}<small>${e(c.no)}</small></div><button data-a="delCus" data-id="${c.id}">✕</button></div>`).join('')}</div>`}
 else{const s=S.set,F=(k,l)=>`<div><label>${l}</label><input data-s="${k}" value="${e(s[k])}"></div>`;
  a.innerHTML=`<h2>Einstellungen</h2><div class="card"><b>Logo</b><br>${s.logo?`<img src="${s.logo}" style="max-height:60px;margin:6px 0"><br>`:''}<input type="file" accept="image/*" data-logo="1"></div><div class="card"><div class="g">${F('name','Firma')}${F('addr','Adresse (eine Zeile)')}${F('city','Ort (für Datum)')}${F('tel','Telefon')}${F('mail','E-Mail')}${F('web','Web')}${F('ustid','USt-ID')}${F('stnr','Steuernummer')}${F('owner','Inhaber')}${F('bank','Bank')}${F('iban','IBAN')}${F('bic','BIC')}${F('prefix','Nummern-Präfix')}${F('next','Nächste Nummer')}${F('vat','USt %')}${F('days','Zahlungsziel (Tage)')}</div><label>Zahlungstext</label><textarea rows="2" data-s="pay">${e(s.pay)}</textarea></div>
  <div class="card"><b>Datensicherung</b><div class="row" style="margin-top:8px"><button data-a="backup">Backup exportieren</button><button data-a="rtxt">Aus Textfeld importieren</button></div><label>Backup-Datei importieren</label><input type="file" accept=".json,application/json" data-rfile="1"><label>Text (Fallback)</label><textarea id="bk" rows="3"></textarea></div>`}}
function csv(){const f=n=>(+n||0).toFixed(2).replace('.',','),q=x=>'"'+String(x??'').replace(/"/g,'""')+'"',T={AZ:'Abschlagsrechnung',SR:'Schlussrechnung',RE:'Rechnung',AN:'Angebot'};
 const r=[['Nummer','Datum','Typ','Kunde','Bauvorhaben','Netto','USt','Brutto','Zahlbar bis','Bezahlt am','Status'].join(';')].concat(S.inv.slice().sort((a,b)=>(a.date+a.no).localeCompare(b.date+b.no)).map(i=>[q(i.no),dd(i.date),T[i.type],q(cusOf(i.cid).name),q(i.bv),f(i.net),f((i.gross||0)-(i.net||0)),f(i.gross),dd(i.due),dd(i.paid),i.status].join(';')));
 dl('rechnungen-'+today()+'.csv',new Blob(['\ufeff'+r.join('\r\n')],{type:'text/csv'}))}
function setp(o,p,v){const a=p.split('.');while(a.length>1)o=o[a.shift()];o[a[0]]=v}
document.addEventListener('input',ev=>{const t=ev.target,d=t.dataset;if(d.q){S.q=t.value;render();const q=document.querySelector('[data-q]');q.focus();q.setSelectionRange(99,99);return}
 if(!d.b||!S.cur)return;if(d.b==='cid'&&t.value==='+'){S.view='cus';S.cur=null;render();return}if(d.b==='pid'){if(t.value==='+'){S.pe=null;S.view='pro';S.cur=null;render();return}S.cur.pid=t.value;const p=S.pro.find(x=>x.id===t.value);if(p){S.cur.cid=p.cid||S.cur.cid;S.cur.bv=p.name;if(isAZ(S.cur))S.cur.prev=histPrev(S.cur);S.cur.title=autoTitle()}renderForm();drawSheet();return}setp(S.cur,d.b,t.type==='checkbox'?t.checked:t.value);const m=d.b.match(/^items\.(\d+)\.(q|ep)$/);if(m){const x=S.cur.items[m[1]],f=document.querySelector('[data-b="items.'+m[1]+'.a"]');if(String(x.ep||'').trim()!==''){x.a=fmt(num(x.q)*num(x.ep));f.value=x.a;f.readOnly=true}else f.readOnly=false}if(t.classList.contains('au'))autosize();if(d.b==='type'){S.cur.title=autoTitle();renderForm()}drawSheet()});
document.addEventListener('change',ev=>{const t=ev.target,d=t.dataset;if(d.s){S.set[d.s]=t.value;saveSet()}
 if(d.logo&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.set.logo=c.toDataURL('image/png');saveSet();render()};im.src=r.result};r.readAsDataURL(t.files[0])}
 if(d.rfile&&t.files[0])t.files[0].text().then(restore)});
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,i=+t.dataset.i,id=t.dataset.id,C=S.cur;
 if(a==='list'){S.view='list';S.cur=null;render()}else if(a==='cus'){S.ce=null;S.view='cus';render()}else if(a==='set'){S.view='set';render()}else if(a==='new')newInv();
 else if(a==='addItem'){C.items.push({q:'1',u:'psch.',t:'',a:'',ep:''});renderForm();drawSheet()}else if(a==='delItem'){C.items.splice(i,1);renderForm();drawSheet()}
 else if(a==='addPrev'){C.prev.push('');renderForm();drawSheet()}else if(a==='delPrev'){C.prev.splice(i,1);renderForm();drawSheet()}else if(a==='hist'){C.prev=histPrev(C);renderForm();drawSheet()}
 else if(a==='save')saveInv();else if(a==='preview')openPreview();else if(a==='csv')csv();else if(a==='pro'){S.pe=null;S.view='pro';render()}else if(a==='stLV'){C.stand=fmt(num((S.pro.find(x=>x.id===C.pid)||{}).lv));renderForm();drawSheet()}else if(a==='up'||a==='dn'){const j=a==='up'?i-1:i+1;if(j>=0&&j<C.items.length){[C.items[i],C.items[j]]=[C.items[j],C.items[i]];renderForm();drawSheet()}}else if(a==='dup'){const o=C;newInv({type:o.type,cid:o.cid,pid:o.pid||'',bv:o.bv,items:JSON.parse(JSON.stringify(o.items)),prev:isAZ(o)?histPrev({id:'',cid:o.cid,bv:o.bv,pid:o.pid}):[],intro:o.intro,outro:o.outro,vat:o.vat,rc:o.rc,priv:o.priv,rab:o.rab,sib:o.sib,sk:o.sk,skd:o.skd})}else if(a==='editPro'){S.pe=S.pro.find(x=>x.id===id);render()}else if(a==='savePro'){const q={name:$('pn').value,cid:$('pc').value,lv:$('pl').value};if(!q.name)return;await db.collection('projects').doc(S.pe?.id||'p'+Date.now()).set(q);S.pe=null;render()}else if(a==='delPro'){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Wirklich?';return}await db.collection('projects').doc(id).delete()}else if(a==='pvclose')$('pv').style.display='none';else if(a==='pvpdf')pdf();else if(a==='pvprint')window.print();else if(a==='editInv'){S.cur=JSON.parse(JSON.stringify(S.inv.find(x=>x.id===id)));S.view='edit';render()}
 else if(a==='folge'){const o=S.inv.find(x=>x.id===id);newInv({cid:o.cid,bv:o.bv,pid:o.pid||'',prev:histPrev({id:'',cid:o.cid,bv:o.bv,pid:o.pid})})}
 else if(a==='delInv'||a==='delCus'){if(!t.dataset.sure){t.dataset.sure=1;t.textContent='Wirklich?';return}if(a==='delInv'){await db.collection('invoices').doc(C.id).delete();S.view='list';S.cur=null;render()}else await db.collection('customers').doc(id).delete()}
 else if(a==='saveCus'){const c={name:$('cn').value,no:$('cr').value,addr:$('ca').value};if(!c.name)return;await db.collection('customers').doc(S.ce?.id||'c'+Date.now()).set(c);S.ce=null;render()}
 else if(a==='editCus'){S.ce=S.cus.find(x=>x.id===id);render()}else if(a==='backup')backup();else if(a==='rtxt')restore($('bk').value)});
addEventListener('resize',()=>{fit();fitPv()});
(async()=>{render();db=mk();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(x){}
 if(!db){$('app').innerHTML='<div class="card">Bitte anmelden bzw. die Seite in Claude öffnen, damit Daten gespeichert werden können.</div>';return}
 const again=()=>{if(S.view==='list'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()};
 db.doc('cfg/main').onSnapshot(d=>{if(d.exists)S.set={...S.set,...d.data()};again()});

 db.collection('projects').onSnapshot(q=>{S.pro=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));again()});
 db.collection('invoices').onSnapshot(q=>{S.inv=q.docs.map(d=>({id:d.id,...d.data()}));again()})})();
